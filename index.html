<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2c7a3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Asagiri Inventory</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Screen 1: Top -->
  <div id="screen-top" class="screen active">
    <div class="header">
      <div>
        <h1>Asagiri Inventory</h1>
        <span class="version" id="app-version"></span>
      </div>
    </div>
    <div class="content">
      <div class="menu">
        <div class="menu-section-label">品目検索</div>
        <button class="btn btn-primary" id="btn-scan" onclick="App.goToScan()">
          <span>&#x1F4F7;</span> スキャン開始
        </button>
        <button class="btn btn-secondary" id="btn-manual" onclick="App.goToManual()">
          <span>&#x2328;</span> 手入力
        </button>
        <div class="menu-section-label">入出庫</div>
        <button class="btn btn-primary" onclick="App.startOp('stockin')">
          <span>&#x1F4E5;</span> 入庫
        </button>
        <button class="btn btn-primary" onclick="App.startOp('stockout')">
          <span>&#x1F4E4;</span> 出庫
        </button>
        <button class="btn btn-secondary" onclick="App.startOp('dispose')">
          <span>&#x1F5D1;</span> 廃棄
        </button>
        <button class="btn btn-secondary" onclick="App.startOp('move')">
          <span>&#x1F504;</span> 移動
        </button>
        <div class="menu-divider"></div>
        <button class="btn btn-outline" onclick="App.goToSettings()">
          <span>&#x2699;</span> 設定
        </button>
      </div>
    </div>
  </div>

  <!-- Screen 2: Scan -->
  <div id="screen-scan" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.goToTop()">&larr;</button>
      <h1>スキャン</h1>
    </div>
    <div class="content">
      <div class="video-container">
        <video id="scan-video" playsinline></video>
      </div>
      <p class="scan-guide">バーコードをカメラに映してください</p>
      <button class="btn btn-secondary" onclick="App.goToManual()">
        <span>&#x2328;</span> 手入力に切替
      </button>
    </div>
  </div>

  <!-- Screen 3: Manual input -->
  <div id="screen-manual" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.goToTop()">&larr;</button>
      <h1>手入力検索</h1>
    </div>
    <div id="camera-banner" class="camera-banner" style="display:none;">
      カメラが使えないため手入力に切替えました
    </div>
    <div class="content">
      <div class="form-group">
        <label for="input-barcode">バーコード or 品目ID</label>
        <input type="text" id="input-barcode" placeholder="例: 4901234567890 or IT001" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="btn-search" onclick="App.searchManual()">
        検索
      </button>
    </div>
  </div>

  <!-- Screen 4: Result -->
  <div id="screen-result" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.goToTop()">&larr;</button>
      <h1>検索結果</h1>
    </div>
    <div class="content">
      <div id="result-content"></div>
      <div id="result-actions"></div>
    </div>
  </div>

  <!-- Screen 5: Loading -->
  <div id="screen-loading" class="screen">
    <div class="header">
      <h1>Asagiri Inventory</h1>
    </div>
    <div class="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>検索中...</p>
      </div>
    </div>
  </div>

  <!-- Screen 6: Settings -->
  <div id="screen-settings" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.goToTop()">&larr;</button>
      <h1>設定</h1>
    </div>
    <div class="content">
      <div class="setting-item">
        <div class="setting-label">アプリバージョン</div>
        <div class="setting-value" id="settings-version"></div>
      </div>
      <div class="setting-item">
        <div class="setting-label">担当者ログイン</div>
        <div class="setting-value" id="settings-gmail"></div>
        <div class="form-group" style="margin-top:12px;">
          <label for="input-gmail">メールアドレス</label>
          <input type="email" id="input-gmail" placeholder="example@gmail.com" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="input-password">パスワード</label>
          <input type="password" id="input-password" placeholder="パスワード" autocomplete="off">
        </div>
        <button class="btn btn-primary" id="btn-save-gmail" onclick="App.saveLogin()" style="margin-top:8px;">
          ログイン
        </button>
        <button class="btn btn-outline" onclick="App.logout()" style="margin-top:8px;color:#d32f2f;border-color:#d32f2f;">
          ログアウト
        </button>
      </div>
      <div class="setting-item">
        <div class="setting-label">場所データ</div>
        <div class="setting-value" id="settings-locations">未取得</div>
        <button class="btn btn-secondary" id="btn-reload-locations" onclick="App.reloadLocations()" style="margin-top:8px;">
          場所データを再取得
        </button>
        <p class="setting-hint">自動キャッシュ更新は今後のバージョンで実装予定</p>
      </div>
      <div class="setting-item">
        <div class="setting-label">API接続先</div>
        <div class="setting-value" id="settings-api"></div>
        <div class="form-group" style="margin-top:12px;">
          <input type="url" id="input-api-url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
        </div>
        <button class="btn btn-primary" id="btn-save-url" onclick="App.saveApiUrl()" style="margin-top:8px;">
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- Screen: Op Scan -->
  <div id="screen-op-scan" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.goToTop()">&larr;</button>
      <h1 id="op-scan-title">スキャン</h1>
    </div>
    <div class="content">
      <div class="video-container">
        <video id="op-scan-video" playsinline></video>
      </div>
      <p class="scan-guide">バーコードをカメラに映してください</p>
      <button class="btn btn-secondary" onclick="App.goToOpManual()">
        <span>&#x2328;</span> 手入力に切替
      </button>
    </div>
  </div>

  <!-- Screen: Op Manual -->
  <div id="screen-op-manual" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.goToTop()">&larr;</button>
      <h1 id="op-manual-title">手入力</h1>
    </div>
    <div id="op-camera-banner" class="camera-banner" style="display:none;">
      カメラが使えないため手入力に切替えました
    </div>
    <div class="content">
      <div class="form-group">
        <label for="input-op-barcode">バーコード or 品目ID</label>
        <input type="text" id="input-op-barcode" placeholder="例: 4901234567890 or IT001" autocomplete="off">
      </div>
      <button class="btn btn-primary" onclick="App.searchOpManual()">
        検索
      </button>
    </div>
  </div>

  <!-- Screen: Op Confirm -->
  <div id="screen-op-confirm" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.goToOpInput()">&larr;</button>
      <h1 id="op-confirm-title">確認</h1>
    </div>
    <div class="content">
      <div id="op-confirm-content"></div>
      <button class="btn btn-primary" id="btn-op-record" onclick="App.recordOp()">
        記録する
      </button>
      <button class="btn btn-secondary" onclick="App.goToOpInput()">
        戻って修正
      </button>
    </div>
  </div>

  <!-- Screen: Op Done -->
  <div id="screen-op-done" class="screen">
    <div class="header">
      <h1>完了</h1>
    </div>
    <div class="content">
      <div id="op-done-content"></div>
      <div id="op-done-actions"></div>
    </div>
  </div>

  <!-- Screen: Op Input -->
  <div id="screen-op-input" class="screen">
    <div class="header">
      <button class="back-btn" onclick="App.goToOpScan()">&larr;</button>
      <h1 id="op-input-title">入力</h1>
    </div>
    <div class="content">
      <div id="op-item-info"></div>
      <div id="op-input-form"></div>
      <button class="btn btn-primary" id="btn-op-confirm" onclick="App.goToOpConfirm()">
        確認画面へ
      </button>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
