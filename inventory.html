<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asagiri Inventory - 在庫管理</title>
  <link rel="stylesheet" href="./inventory.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1>Asagiri Inventory</h1>
      <p>在庫管理画面にログイン</p>
      <div class="filter-group">
        <label for="login-email">メールアドレス</label>
        <input type="email" id="login-email" placeholder="example@gmail.com">
      </div>
      <div class="filter-group">
        <label for="login-password">パスワード</label>
        <input type="password" id="login-password" placeholder="パスワード">
      </div>
      <button class="btn-fetch" style="width:100%;margin-top:12px;" onclick="Inv.login()">ログイン</button>
    </div>
  </div>

  <div class="page" id="main-page" style="display:none;">
    <header class="page-header">
      <h1>Asagiri Inventory - 在庫管理</h1>
      <div>
        <span id="login-user" style="font-size:13px;color:#666;margin-right:12px;"></span>
        <button class="btn-print" onclick="window.print()">印刷</button>
        <button class="btn-logout" onclick="Inv.logout()">ログアウト</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="stock" onclick="Inv.switchTab('stock')">現在在庫</button>
      <button class="tab" data-tab="lots" onclick="Inv.switchTab('lots')">賞味期限</button>
      <button class="tab" data-tab="history" onclick="Inv.switchTab('history')">入出庫履歴</button>
      <button class="tab" data-tab="stocktake" onclick="Inv.switchTab('stocktake')">棚卸</button>
    </nav>

    <div class="filters" id="filters"></div>

    <div id="st-summary" class="st-summary" style="display:none;"></div>

    <div class="table-container">
      <table id="data-table">
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
      <div id="empty-message" class="empty-message" style="display:none;">
        データを読み込んでいます...
      </div>
    </div>

    <footer class="page-footer">
      <span id="row-count">表示: 0件</span>
    </footer>

    <!-- Item Registration Modal -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="Inv.closeModalOnOverlay(event)">
      <div class="modal">
        <div class="modal-header">
          <h2>商品登録</h2>
          <button class="modal-close" onclick="Inv.closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-field">
              <label>品名 <span class="required">*</span></label>
              <input type="text" id="reg-name" placeholder="品名を入力">
            </div>
            <div class="form-field">
              <label>バーコード</label>
              <input type="text" id="reg-barcode" placeholder="JAN or 自社QR">
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>大カテゴリ <span class="required">*</span></label>
              <select id="reg-category">
                <option value="">選択してください</option>
                <option value="原料">原料</option>
                <option value="加工品">加工品</option>
                <option value="備品">備品</option>
                <option value="消耗品">消耗品</option>
                <option value="完成品">完成品</option>
              </select>
            </div>
            <div class="form-field">
              <label>中カテゴリ</label>
              <input type="text" id="reg-subcategory" placeholder="自由入力">
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>単位 <span class="required">*</span></label>
              <select id="reg-unit">
                <option value="">選択してください</option>
                <option value="個">個</option>
                <option value="kg">kg</option>
                <option value="本">本</option>
                <option value="箱">箱</option>
                <option value="袋">袋</option>
                <option value="枚">枚</option>
                <option value="缶">缶</option>
                <option value="パック">パック</option>
              </select>
            </div>
            <div class="form-field">
              <label>税率 <span class="required">*</span></label>
              <select id="reg-tax">
                <option value="0.08">8%</option>
                <option value="0.10">10%</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>標準単価</label>
              <input type="number" id="reg-cost" placeholder="0" min="0">
            </div>
            <div class="form-field">
              <label>販売単価</label>
              <input type="number" id="reg-price" placeholder="0" min="0">
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>主場所</label>
              <select id="reg-location">
                <option value="">指定なし</option>
              </select>
            </div>
            <div class="form-field">
              <label>閾値（在庫アラート）</label>
              <input type="number" id="reg-threshold" placeholder="未設定" min="0">
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label class="checkbox-label">
                <input type="checkbox" id="reg-lot"> ロット管理する
              </label>
            </div>
            <div class="form-field">
              <label class="checkbox-label">
                <input type="checkbox" id="reg-expiry"> 賞味期限管理する
              </label>
            </div>
          </div>
          <div id="reg-message" class="reg-message" style="display:none;"></div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="Inv.closeModal()">キャンセル</button>
          <button class="btn-fetch" id="btn-reg-continue" onclick="Inv.registerItem(true)">登録して続けて入力</button>
          <button class="btn-fetch" id="btn-reg-close" onclick="Inv.registerItem(false)">登録して閉じる</button>
        </div>
      </div>
    </div>

    <!-- Stocktake Detail Modal -->
    <div id="st-modal-overlay" class="modal-overlay" style="display:none;" onclick="Inv.closeStModal(event)">
      <div class="modal" style="max-width:800px;">
        <div class="modal-header">
          <h2 id="st-modal-title">棚卸詳細</h2>
          <button class="modal-close" onclick="Inv.closeStDetailModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div id="st-print-header" class="st-print-header">
            <h3 id="st-print-title">棚卸報告書</h3>
            <div id="st-print-meta"></div>
          </div>
          <div class="table-container" style="max-height:400px;overflow-y:auto;">
            <table>
              <thead>
                <tr>
                  <th>品目ID</th>
                  <th>品名</th>
                  <th style="text-align:right;">帳簿在庫</th>
                  <th style="text-align:right;">実数</th>
                  <th style="text-align:right;">差異</th>
                  <th>備考</th>
                </tr>
              </thead>
              <tbody id="st-detail-body"></tbody>
            </table>
          </div>
        </div>
        <div id="st-save-message" class="reg-message" style="display:none;margin:0 24px;"></div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="Inv.closeStDetailModal()">閉じる</button>
          <button class="btn-fetch" id="btn-st-print" style="background:#555;" onclick="Inv.printStReport()">印刷</button>
          <button class="btn-fetch" id="btn-st-save" style="display:none;background:#1565c0;" onclick="Inv.saveStCounts()">修正を保存</button>
          <button class="btn-fetch" id="btn-st-approve" onclick="Inv.approveStocktake()">承認して在庫調整</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./inventory.js"></script>
</body>
</html>
